services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/airbnb.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - roam_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  roam_data:
